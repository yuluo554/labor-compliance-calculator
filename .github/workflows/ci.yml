name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: "test (${{ matrix.os }} / py${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.8"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install (dev extras)
        run: python -m pip install -e "./code[dev]"

      - name: Environment probe
        run: |
          python -c "import sys; print(sys.version)"

      - name: Repo gates (literals / frozen rulesets / frozen truth / dessensitize)
        run: |
          python tools/check_no_literals.py
          python tools/gen_rulesets.py --check
          python tools/gen_cases.py --check
          python tools/dessensitize_audit.py --mode tracked

      - name: Benchmarks (B1 / B2 / B3)
        run: python tools/bench.py

      - name: Run tests
        run: python -m pytest code/tests -q

      - name: CLI smoke
        run: |
          python -m lcc params
          python -m lcc doctor
          python -m lcc calc examples/sample-case.json --modules severance
        env:
          PYTHONPATH: code/src